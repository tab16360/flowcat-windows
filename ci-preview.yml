# Copy into .github/workflows/windows.yml when a token with workflow scope is available.
name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        shell: pwsh
        run: ./build.ps1
      - name: Package installer
        shell: pwsh
        run: ./package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCat-Windows-x64-Setup
          path: dist/*
